version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_club_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # DDL-схема виконується автоматично при першому старті контейнера.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Усередині compose-мережі БД доступна за іменем сервісу,
      # тому PGHOST з .env (localhost) перевизначається.
      PGHOST: db
      # Ollama працює нативно на хості (Docker на macOS не має доступу
      # до GPU/Metal), тому з контейнера звертаємось через host-шлюз.
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
