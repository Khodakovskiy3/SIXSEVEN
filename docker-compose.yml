services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_club_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
    # TZ/PGTZ офіційним образом Postgres для часу в логах НЕ використовуються
    # (PGTZ — це лише для клієнтських бібліотек libpq). Час логів керується
    # параметром log_timezone, тому передаємо його явно як аргумент сервера.
    command: ["postgres", "-c", "log_timezone=Europe/Kyiv"]
    ports:
      # Проброс на хост потрібен, коли сервер (npm run dev) запускається
      # НЕ в Docker, а напряму на машині розробника.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # DDL-схема виконується автоматично при першому старті контейнера.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5


  # Щоденне резервне копіювання БД (кросплатформенно: macOS/Windows/Linux).
  # Копії з'являються у ./backups на хості; лог — ./backups/db-backup.log
  # і `docker compose logs db-backup`. Якщо стек не працював о 10:00,
  # пропущений бекап робиться одразу при старті контейнера.
  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: sports_club_db
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      TZ: Europe/Kyiv
    volumes:
      - ./backups:/backups
      - ./scripts/db-backup-cron.sh:/usr/local/bin/db-backup-cron.sh:ro
      - ./scripts/db-restore-docker.sh:/usr/local/bin/db-restore-docker.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    # 1) прибираємо CR: на Windows git міг перетворити LF на CRLF,
    #    що ламає скрипт в Alpine («set: illegal option -»);
    # 2) tzdata — щоб «10:00» означало київський час, а не UTC;
    # 3) наздоганяємо бекап, якщо за сьогодні його ще немає;
    # 4) crond щодня о 10:00 запускає скрипт (вивід — у docker logs).
    command:
      - |
        tr -d '\r' < /usr/local/bin/db-backup-cron.sh > /tmp/db-backup-cron.sh
        tr -d '\r' < /usr/local/bin/db-restore-docker.sh > /usr/local/bin/restore
        chmod +x /usr/local/bin/restore
        [ -e /usr/share/zoneinfo/Europe/Kyiv ] || apk add --no-cache tzdata
        ls /backups/sports_club_db_"$$(date +%F)"_*.sql.gz >/dev/null 2>&1 \
          || sh /tmp/db-backup-cron.sh
        echo '0 10 * * * sh /tmp/db-backup-cron.sh >> /proc/1/fd/1 2>&1' \
          > /var/spool/cron/crontabs/root
        exec crond -f
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Усередині compose-мережі БД доступна за іменем сервісу,
      # тому PGHOST з .env (localhost) перевизначається.
      PGHOST: db
      # За замовчуванням Ollama працює нативно на хості (Docker на macOS
      # не має доступу до GPU/Metal), тому йдемо через host-шлюз.
      # Для повністю контейнерного запуску (profile "ollama") задайте
      # у .env: OLLAMA_DOCKER_URL=http://ollama:11434
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy

  # АІ-асистент у контейнері — опціонально (docker compose --profile ollama up).
  # На macOS працює лише на CPU, тому для розробки швидша нативна Ollama;
  # профіль призначений насамперед для деплою на Linux-сервер.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      # Завантажені моделі переживають перезапуск контейнера.
      - ollama_models:/root/.ollama
    # Стандартний entrypoint лише піднімає сервер; нам треба ще й
    # автоматично завантажити модель при першому старті.
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-qwen3:8b}; wait"]

volumes:
  postgres_data:
  ollama_models:
