<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Кабінет керівника - Сповіщення</title>
    <link rel="stylesheet" href="../../styles/manager.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
</head>
<body>
    <div class="app-shell manager-shell">
        <aside class="sidebar">
            <div class="brand brand-sidebar">OLIMP</div>
            <nav class="side-nav" aria-label="Навігація керівника">
                <button class="nav-item" data-screen="dashboard">Панель керування</button>
                <button class="nav-item" data-screen="users">Користувачі</button>
                <button class="nav-item" data-screen="analytics">Аналітика</button>
            </nav>
            <button class="logout ghost">Вийти</button>
        </aside>

        <main class="client-app manager-app">
            <header class="topbar">
                <div>
                    <div class="brand">OLIMP</div>
                    <h1 id="screen-title">Сповіщення</h1>
                </div>
                <div class="top-actions">
                    <button class="icon-btn notification-btn" aria-label="Повідомлення">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 22a2.8 2.8 0 0 0 2.7-2h-5.4A2.8 2.8 0 0 0 12 22Z"></path>
                            <path d="M18.2 16.5c-.9-1-1.4-2.2-1.4-3.6V10a4.8 4.8 0 0 0-3.5-4.6V4a1.3 1.3 0 1 0-2.6 0v1.4A4.8 4.8 0 0 0 7.2 10v2.9c0 1.4-.5 2.7-1.4 3.6l-.6.7c-.6.7-.1 1.8.8 1.8h12c.9 0 1.4-1.1.8-1.8l-.6-.7Z"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </button>
                    <button class="avatar" data-screen-link="profile" aria-label="Мій профіль">KR</button>
                </div>
            </header>

            <section class="screen active detail-screen" data-screen-panel="profile-settings">
                <div class="panel narrow-panel">
                    <button class="back-btn" data-screen-link="profile">Назад</button>
                    <h2>Сповіщення</h2>
                    <div class="settings-list" id="manager-settings-list">
                        <label>Push-сповіщення <input type="checkbox" data-setting="push" checked></label>
                        <label>Email-сповіщення <input type="checkbox" data-setting="email" checked></label>
                        <label>Фінансові підсумки <input type="checkbox" data-setting="financial"></label>
                    </div>
                    <p class="form-note" id="manager-settings-feedback" role="status"></p>
                    <button class="primary-btn" id="save-manager-settings">Зберегти зміни</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav manager-bottom-nav" aria-label="Нижня навігація">
            <button class="bottom-item" data-screen="dashboard">Панель керування</button>
                <button class="bottom-item" data-screen="users">Користувачі</button>
                <button class="bottom-item" data-screen="analytics">Аналітика</button>
        </nav>
    </div>

    <div class="sheet-backdrop" id="sheet">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h2 id="sheet-title">Деталі</h2>
            <div id="sheet-content" class="sheet-content"></div>
            <button class="primary-btn sheet-close">Закрити</button>
        </div>
    </div>

    <div class="modal-backdrop" id="manager-modal">
        <div class="modal">
            <h2 id="modal-title">Підтвердження</h2>
            <p id="modal-text">Дія буде застосована після підтвердження.</p>
            <div class="modal-actions">
                <button class="ghost-btn modal-close">Скасувати</button>
                <button class="primary-btn modal-close">Підтвердити</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/manager.js"></script>
</body>
</html>
