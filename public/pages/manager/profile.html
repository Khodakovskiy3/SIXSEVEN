<!DOCTYPE html>
<html lang="uk">
<head>
    <script>(function(){var t=localStorage.getItem("olimp-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");})()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Кабінет керівника - Профіль</title>
    <link rel="stylesheet" href="../../styles/manager.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
</head>
<body>
    <div class="app-shell manager-shell">
        <aside class="sidebar">
            <div class="brand brand-sidebar">OLIMP</div>
            <button class="sidebar-toggle" aria-label="Розгорнути меню">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <nav class="side-nav" aria-label="Навігація керівника">
                <button class="nav-item" data-screen="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="nav-label">Панель керування</span></button>
                <button class="nav-item" data-screen="users"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="nav-label">Користувачі</span></button>
                <button class="nav-item" data-screen="analytics"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span class="nav-label">Аналітика</span></button>
                <button class="nav-item active" data-screen="profile"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Профіль</span></button>
            </nav>
            <button class="logout ghost"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="nav-label">Вийти</span></button>
        </aside>

        <main class="client-app manager-app">
            <header class="topbar">
                <div>
                    <div class="brand">OLIMP</div>
                    <h1 id="screen-title">Профіль</h1>
                </div>
                <div class="top-actions">
                    <button class="icon-btn notification-btn" aria-label="Повідомлення"><svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 22a2.8 2.8 0 0 0 2.7-2h-5.4A2.8 2.8 0 0 0 12 22Z"></path>
                            <path d="M18.2 16.5c-.9-1-1.4-2.2-1.4-3.6V10a4.8 4.8 0 0 0-3.5-4.6V4a1.3 1.3 0 1 0-2.6 0v1.4A4.8 4.8 0 0 0 7.2 10v2.9c0 1.4-.5 2.7-1.4 3.6l-.6.7c-.6.7-.1 1.8.8 1.8h12c.9 0 1.4-1.1.8-1.8l-.6-.7Z"></path>
                        </svg>
                        <span class="notification-dot"></span></button>
                    <button class="avatar" data-screen-link="profile" aria-label="Мій профіль" data-account-field="initials"></button>
                </div>
            </header>

            <section class="screen active" data-screen-panel="profile">
                <div class="adm-profile-wrap">

                    <div class="adm-profile-left">
                        <div class="adm-profile-hero">
                            <div class="adm-profile-ring">
                                <div class="adm-profile-avatar" data-account-field="initials"></div>
                            </div>
                            <div class="adm-profile-role-badge">Керівник</div>
                            <h2 class="adm-profile-name" data-account-field="name">Завантаження…</h2>
                            <p class="adm-profile-email" data-account-field="email"></p>
                            <p class="adm-profile-phone" data-account-field="phone" data-account-fallback="Телефон не вказано"></p>
                        </div>
                    </div>

                    <div class="adm-profile-right">
                        <div class="adm-profile-menu">
                            <h3 class="adm-menu-section-label">Мій кабінет</h3>

                            <button class="adm-menu-item" data-screen-link="personal"><span class="adm-menu-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </span>
                                <span class="adm-menu-label">
                                    <strong>Особисті дані</strong>
                                    <small>Ім'я, email, телефон</small>
                                </span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg></button>

                            <button class="adm-menu-item" data-screen-link="profile-settings"><span class="adm-menu-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                </span>
                                <span class="adm-menu-label">
                                    <strong>Сповіщення</strong>
                                    <small>Канали та налаштування</small>
                                </span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg></button>

                            <div class="adm-menu-divider"></div>

                            <button class="adm-menu-item adm-menu-item--danger logout-row">
                                <span class="adm-menu-icon adm-menu-icon--danger">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                </span>
                                <span class="adm-menu-label">
                                    <strong>Вийти</strong>
                                    <small>Завершити сесію</small>
                                </span>
                            </button>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <nav class="bottom-nav manager-bottom-nav" aria-label="Нижня навігація">
            <button class="bottom-item" data-screen="dashboard">Головна</button>
            <button class="bottom-item" data-screen="users">Користувачі</button>
            <button class="bottom-item" data-screen="analytics">Аналітика</button>
            <button class="bottom-item active" data-screen="profile">Профіль</button>
        </nav>
    </div>

    <div class="sheet-backdrop" id="sheet">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h2 id="sheet-title">Деталі</h2>
            <div id="sheet-content" class="sheet-content"></div>
            <button class="primary-btn sheet-close">Закрити</button>
        </div>
    </div>

    <script type="module" src="../../js/manager.js"></script>
    <script type="module" src="../../js/pwa.js"></script>
</body>
</html>
