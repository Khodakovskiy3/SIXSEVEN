<!DOCTYPE html>
<html lang="uk">
<head>
    <script>(function(){var t=localStorage.getItem("olimp-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");})()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Кабінет клієнта - Особисті дані</title>
    <link rel="stylesheet" href="../../styles/client.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="stylesheet" href="../../styles/chat-widget.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand brand-sidebar">OLIMP</div>
            <button class="sidebar-toggle" aria-label="Розгорнути меню">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <nav class="side-nav" aria-label="Навігація клієнта">
                <button class="nav-item" data-screen="home"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></span><span class="nav-label">Головна</span></button>
                <button class="nav-item" data-screen="schedule"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="nav-label">Розклад</span></button>
                <button class="nav-item" data-screen="records"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="nav-label">Записи</span></button>
                <button class="nav-item" data-screen="profile"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Профіль</span></button>
            </nav>
            <button class="logout ghost"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="nav-label">Вийти</span></button>
        </aside>

        <main class="client-app">
            <header class="topbar">
                <div>
                    <div class="brand">OLIMP</div>
                    <h1 id="screen-title">Особисті дані</h1>
                </div>
                <div class="top-actions">
                    <button class="icon-btn notification-btn" aria-label="Повідомлення"><svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 22a2.8 2.8 0 0 0 2.7-2h-5.4A2.8 2.8 0 0 0 12 22Z"></path>
                            <path d="M18.2 16.5c-.9-1-1.4-2.2-1.4-3.6V10a4.8 4.8 0 0 0-3.5-4.6V4a1.3 1.3 0 1 0-2.6 0v1.4A4.8 4.8 0 0 0 7.2 10v2.9c0 1.4-.5 2.7-1.4 3.6l-.6.7c-.6.7-.1 1.8.8 1.8h12c.9 0 1.4-1.1.8-1.8l-.6-.7Z"></path>
                        </svg>
                        <span class="notification-dot"></span></button>
                    <button class="avatar" data-screen-link="profile" aria-label="Мій профіль" data-account-field="initials"></button>
                </div>
            </header>

            <section class="screen active detail-screen" data-screen-panel="personal">
                <div class="panel narrow-panel">
                    <button class="back-btn" data-screen-link="profile">Назад</button>
                    <h2>Особисті дані</h2>
                    <form id="client-profile-form">
                        <label>Ім’я<input type="text" name="name" data-account-field="name"></label>
                        <label>Телефон<input type="tel" name="phone" id="phone-input" data-account-field="phone" placeholder="+380XXXXXXXXX" maxlength="13" inputmode="numeric"></label>
                        <label>Email<input type="email" data-account-field="email" disabled></label>
                        <p class="form-note" id="profile-feedback" role="status"></p>
                        <div class="form-actions">
                            <button type="submit" class="primary-btn">Зберегти</button>
                            <button type="button" class="ghost-btn" data-change-password>Змінити пароль</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <nav class="bottom-nav " aria-label="Нижня навігація">
            <button class="bottom-item" data-screen="home">Головна</button>
                <button class="bottom-item" data-screen="schedule">Розклад</button>
                <button class="bottom-item" data-screen="records">Записи</button>
                <button class="bottom-item active" data-screen="profile">Профіль</button>
        </nav>
    </div>

    <div class="sheet-backdrop" id="sheet">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h2 id="sheet-title">Йога</h2>
            <p id="sheet-text">Релаксація, гнучкість та зміцнення тіла через комплекс вправ і дихальних практик.</p>
            <dl>
                <div><dt>Тривалість</dt><dd>50 хв</dd></div>
                <div><dt>Рівень</dt><dd>для всіх</dd></div>
                <div><dt>Тренер</dt><dd>Анна</dd></div>
            </dl>
            <button class="primary-btn sheet-close">Закрити</button>
        </div>
    </div>

    <div class="modal-backdrop" id="password-modal">
        <div class="modal">
            <h2>Змінити пароль</h2>
            <form id="password-form">
                <label>Поточний пароль<input type="password" name="currentPassword" required autocomplete="current-password"></label>
                <label>Новий пароль<input type="password" name="newPassword" required autocomplete="new-password"></label>
                <label>Підтвердьте пароль<input type="password" name="confirmPassword" required autocomplete="new-password"></label>
                <p class="form-note" id="password-feedback" role="status"></p>
                <div class="modal-actions">
                    <button type="button" class="ghost-btn" data-password-cancel>Скасувати</button>
                    <button type="submit" class="primary-btn">Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../js/client.js"></script>
    <script>
        (function () {
            const PREFIX = '+380';
            const MAX = 13; // +380XXXXXXXXX
            const input = document.getElementById('phone-input');
            if (!input) return;

            function enforce(val) {
                // Видаляємо все крім цифр і +
                let digits = val.replace(/[^0-9]/g, '');
                // Формуємо рядок: +380 + решта цифр, але не більше 9 після +380
                let result = PREFIX + digits.slice(0, MAX - PREFIX.length);
                return result;
            }

            input.addEventListener('focus', function () {
                if (!this.value || this.value === '') {
                    this.value = PREFIX;
                }
            });

            input.addEventListener('input', function () {
                const pos = this.selectionStart;
                const raw = this.value;
                // Якщо користувач видалив префікс — відновлюємо
                if (!raw.startsWith(PREFIX)) {
                    const digits = raw.replace(/[^0-9]/g, '');
                    this.value = PREFIX + digits.slice(0, MAX - PREFIX.length);
                } else {
                    const after = raw.slice(PREFIX.length).replace(/[^0-9]/g, '');
                    this.value = PREFIX + after.slice(0, MAX - PREFIX.length);
                }
            });

            input.addEventListener('keydown', function (e) {
                // Не дати видалити префікс +380
                const start = this.selectionStart;
                const end = this.selectionEnd;
                if ((e.key === 'Backspace' && start <= PREFIX.length && start === end) ||
                    (e.key === 'Delete'    && start < PREFIX.length)) {
                    e.preventDefault();
                }
            });
        })();
    </script>
    <script src="../../js/chat-widget.js"></script>
    <script type="module" src="../../js/pwa.js"></script>
</body>
</html>
