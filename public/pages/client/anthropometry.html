<!DOCTYPE html>
<html lang="uk">
<head>
    <script>(function(){var t=localStorage.getItem("olimp-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");})()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Кабінет клієнта - Антропометрія</title>
    <link rel="stylesheet" href="../../styles/client.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <style>
        @media (min-width: 900px) {
            html, body { overflow: hidden; height: 100%; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand brand-sidebar">OLIMP</div>
            <button class="sidebar-toggle" aria-label="Розгорнути меню">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <nav class="side-nav" aria-label="Навігація клієнта">
                <button class="nav-item" data-screen="home"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></span><span class="nav-label">Головна</span></button>
                <button class="nav-item" data-screen="schedule"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="nav-label">Розклад</span></button>
                <button class="nav-item" data-screen="records"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="nav-label">Записи</span></button>
                <button class="nav-item" data-screen="profile"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Профіль</span></button>
            </nav>
            <button class="logout ghost"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="nav-label">Вийти</span></button>
        </aside>

        <main class="client-app">
            <header class="topbar">
                <div>
                    <div class="brand">OLIMP</div>
                    <h1 id="screen-title">Антропометрія</h1>
                </div>
                <div class="top-actions">
                    <button class="icon-btn notification-btn" aria-label="Повідомлення"><svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 22a2.8 2.8 0 0 0 2.7-2h-5.4A2.8 2.8 0 0 0 12 22Z"></path>
                            <path d="M18.2 16.5c-.9-1-1.4-2.2-1.4-3.6V10a4.8 4.8 0 0 0-3.5-4.6V4a1.3 1.3 0 1 0-2.6 0v1.4A4.8 4.8 0 0 0 7.2 10v2.9c0 1.4-.5 2.7-1.4 3.6l-.6.7c-.6.7-.1 1.8.8 1.8h12c.9 0 1.4-1.1.8-1.8l-.6-.7Z"></path>
                        </svg>
                        <span class="notification-dot"></span></button>
                    <button class="avatar" data-screen-link="profile" aria-label="Мій профіль" data-account-field="initials"></button>
                </div>
            </header>

            <section class="screen active detail-screen" data-screen-panel="anthropometry">
                <div class="anthro-page-wrap">

                    <!-- Ліва колонка: форма -->
                    <div class="panel anthro-form-panel">
                        <button class="back-btn" data-screen-link="profile">Назад</button>
                        <div class="anthro-form-header">
                            <h2>Новий вимір</h2>
                            <button class="ghost-btn anthro-history-btn" id="anthro-history-open" type="button">Історія вимірів</button>
                        </div>

                        <div class="anthro-date-row">
                            <span class="anthro-label">Дата виміру</span>
                            <input type="date" id="anthro-date" class="anthro-date-input">
                        </div>

                        <div class="anthro-grid">
                            <label class="anthro-field">
                                <span class="anthro-label">Вага, кг</span>
                                <input type="number" id="af-weight" class="anthro-input" step="0.1" min="0" max="300" placeholder="70.5">
                            </label>
                            <label class="anthro-field">
                                <span class="anthro-label">Зріст, см</span>
                                <input type="number" id="af-height" class="anthro-input" step="0.1" min="0" max="250" placeholder="175">
                            </label>
                            <label class="anthro-field">
                                <span class="anthro-label">Груди, см</span>
                                <input type="number" id="af-chest" class="anthro-input" step="0.1" min="0" placeholder="95">
                            </label>
                            <label class="anthro-field">
                                <span class="anthro-label">Талія, см</span>
                                <input type="number" id="af-waist" class="anthro-input" step="0.1" min="0" placeholder="75">
                            </label>
                            <label class="anthro-field">
                                <span class="anthro-label">Стегна, см</span>
                                <input type="number" id="af-hips" class="anthro-input" step="0.1" min="0" placeholder="95">
                            </label>
                            <label class="anthro-field">
                                <span class="anthro-label">Біцепс, см</span>
                                <input type="number" id="af-bicep" class="anthro-input" step="0.1" min="0" placeholder="35">
                            </label>
                            <label class="anthro-field anthro-field--full">
                                <span class="anthro-label">Стегно, см</span>
                                <input type="number" id="af-thigh" class="anthro-input" step="0.1" min="0" placeholder="55">
                            </label>
                        </div>

                        <label class="anthro-field">
                            <span class="anthro-label">Нотатка</span>
                            <input type="text" id="af-note" class="anthro-input" placeholder="Наприклад: після свят, старт програми…">
                        </label>

                        <p class="form-note" id="anthro-feedback" role="status"></p>
                        <button class="primary-btn" id="anthro-save-btn">Зберегти вимір</button>
                    </div>

                    <!-- Права колонка: прогрес + історія -->
                    <div class="anthro-right-col">

                        <!-- Прогрес -->
                        <div class="panel anthro-progress-panel" id="anthro-progress-wrap" style="display:none">
                            <h3 class="anthro-section-title">Прогрес</h3>
                            <div id="anthro-progress"></div>
                        </div>

                        <!-- Історія -->
                        <div class="panel anthro-history-panel">
                            <h3 class="anthro-section-title">Історія вимірів</h3>
                            <div id="anthro-history"></div>
                        </div>

                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Нижня навігація">
            <button class="bottom-item" data-screen="home">Головна</button>
            <button class="bottom-item" data-screen="schedule">Розклад</button>
            <button class="bottom-item" data-screen="records">Записи</button>
            <button class="bottom-item active" data-screen="profile">Профіль</button>
        </nav>
    </div>

    <!-- Мобільна модалка: Історія вимірів -->
    <div class="anthro-history-modal" id="anthro-history-modal" aria-hidden="true">
        <div class="anthro-history-modal__inner">
            <div class="anthro-history-modal__head">
                <h3>Історія вимірів</h3>
                <button class="icon-btn" id="anthro-history-close" aria-label="Закрити">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="anthro-history-modal__body" id="anthro-history-modal-body"></div>
        </div>
    </div>

    <script type="module" src="../../js/client.js"></script>
    <script>
        // Мобільна модалка «Історія вимірів»
        const openBtn  = document.getElementById('anthro-history-open');
        const closeBtn = document.getElementById('anthro-history-close');
        const modal    = document.getElementById('anthro-history-modal');
        const modalBody = document.getElementById('anthro-history-modal-body');

        function openHistory() {
            const src = document.getElementById('anthro-history');
            if (src) modalBody.innerHTML = src.innerHTML;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeHistory() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (openBtn)  openBtn.addEventListener('click', openHistory);
        if (closeBtn) closeBtn.addEventListener('click', closeHistory);
        if (modal)    modal.addEventListener('click', e => { if (e.target === modal) closeHistory(); });
    </script>
</body>
</html>
