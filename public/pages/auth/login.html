<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Вхід</title>
    <link rel="stylesheet" href="../../styles/login.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f0f10">
</head>
<body class="auth-page">
    <header class="auth-topbar">
        <a class="auth-brand" href="../home/index.html">OLIMP</a>
    </header>
    <main class="auth-shell">
        <div class="login-container auth-card">
        <p class="auth-kicker">Особистий кабінет</p>
        <h2>Увійти</h2>
        <p class="auth-subtitle">Увійдіть, щоб керувати тренуваннями, розкладом та абонементами.</p>
        <form id="login-form" action="#" method="post">
            <div class="form-group">
                <label for="username">Email або ім'я користувача</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Показати пароль">
                        <span class="eye-icon eye-hidden" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
            <button type="submit">Увійти</button>
        </form>

        <!-- Другий крок входу за увімкненої двофакторної автентифікації -->
        <form id="login-2fa-form" action="#" method="post" style="display:none">
            <p class="auth-subtitle">Ми надіслали одноразовий код на вашу пошту. Введіть його, щоб завершити вхід.</p>
            <div class="form-group">
                <label for="login-code">Код підтвердження</label>
                <input type="text" id="login-code" name="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
            </div>
            <button type="submit">Підтвердити</button>
            <button type="button" id="login-2fa-back" class="auth-link-btn" style="margin-top:.6rem;background:none;border:none;color:inherit;opacity:.7;cursor:pointer;text-decoration:underline">Назад</button>
        </form>

        <div id="login-message" class="auth-toast" role="alert" aria-live="polite"></div>
        <p class="auth-switch">Немає акаунту? <a href="register.html">Зареєструватися</a></p>
        </div>
    </main>
    <script type="module" src="../../js/auth.js"></script>
    <script type="module" src="../../js/pwa.js"></script>
</body>
</html>
