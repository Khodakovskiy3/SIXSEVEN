<!DOCTYPE html>
<html lang="uk">
<head>
    <script>(function(){var t=localStorage.getItem("olimp-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");})()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Кабінет тренера - Налаштування</title>
    <link rel="stylesheet" href="../../styles/trainer.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
</head>
<body>
    <div class="app-shell trainer-shell">
        <aside class="sidebar">
            <div class="brand brand-sidebar">OLIMP</div>
            <button class="sidebar-toggle" aria-label="Розгорнути меню">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <nav class="side-nav" aria-label="Навігація тренера">
                <button class="nav-item" data-screen="home"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></span><span class="nav-label">Головна</span></button>
                <button class="nav-item" data-screen="schedule"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="nav-label">Розклад</span></button>
                <button class="nav-item" data-screen="profile"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Профіль</span></button>
            </nav>
            <button class="logout ghost"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="nav-label">Вийти</span></button>
        </aside>

        <main class="client-app trainer-app">
            <header class="topbar">
                <div>
                    <div class="brand">OLIMP</div>
                    <h1 id="screen-title">Налаштування</h1>
                </div>
                <div class="top-actions">
                    <button class="icon-btn notification-btn" aria-label="Повідомлення"><svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 22a2.8 2.8 0 0 0 2.7-2h-5.4A2.8 2.8 0 0 0 12 22Z"></path>
                            <path d="M18.2 16.5c-.9-1-1.4-2.2-1.4-3.6V10a4.8 4.8 0 0 0-3.5-4.6V4a1.3 1.3 0 1 0-2.6 0v1.4A4.8 4.8 0 0 0 7.2 10v2.9c0 1.4-.5 2.7-1.4 3.6l-.6.7c-.6.7-.1 1.8.8 1.8h12c.9 0 1.4-1.1.8-1.8l-.6-.7Z"></path>
                        </svg>
                        <span class="notification-dot"></span></button>
                    <button class="avatar" data-screen-link="profile" aria-label="Мій профіль">IA</button>
                </div>
            </header>

            <section class="screen active detail-screen" data-screen-panel="settings">
                <div class="panel narrow-panel">
                    <button class="back-btn" data-screen-link="profile">Назад</button>
                    <h2>Налаштування</h2>
                    <div class="settings-list">
                        <label>Push-сповіщення <input type="checkbox" checked></label>
                        <label>Нагадування про заняття <input type="checkbox" checked></label>
                        <label>Тема застосунку <span>Темна</span></label>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav " aria-label="Нижня навігація">
            <button class="bottom-item" data-screen="home">Головна</button>
                <button class="bottom-item" data-screen="schedule">Розклад</button>
                <button class="bottom-item active" data-screen="profile">Профіль</button>
        </nav>
    </div>

    <div class="sheet-backdrop" id="sheet">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h2 id="sheet-title">Фітнес</h2>
            <p id="sheet-text">Силове функціональне тренування для витривалості та загального тонусу.</p>
            <dl id="sheet-details"></dl>
            <button class="primary-btn sheet-close">Закрити</button>
        </div>
    </div>

    <div class="modal-backdrop" id="password-modal">
        <div class="modal">
            <h2>Змінити пароль</h2>
            <label>Поточний пароль<input type="password"></label>
            <label>Новий пароль<input type="password"></label>
            <label>Підтвердити пароль<input type="password"></label>
            <div class="modal-actions">
                <button class="ghost-btn modal-close">Скасувати</button>
                <button class="primary-btn modal-close">Зберегти</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/trainer.js"></script>
    <script type="module" src="../../js/pwa.js"></script>
</body>
</html>
