<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP - Кабінет адміністратора - Головна</title>
    <link rel="stylesheet" href="../../styles/admin.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
</head>
<body>
    <div class="app-shell admin-shell">
        <aside class="sidebar">
            <div class="brand brand-sidebar">OLIMP</div>
            <nav class="side-nav" aria-label="Навігація адміністратора">
                <button class="nav-item active" data-screen="dashboard">Головна</button>
                <button class="nav-item" data-screen="clients">Клієнти</button>
                <button class="nav-item" data-screen="trainers">Тренери</button>
                <button class="nav-item" data-screen="schedule">Розклад</button>
                <button class="nav-item" data-screen="services">Послуги</button>
                <button class="nav-item" data-screen="plans">Абонементи</button>
                <button class="nav-item" data-screen="messages">Повідомлення</button>
                <button class="nav-item" data-screen="profile">Профіль</button>
            </nav>
            <button class="logout ghost">Вийти</button>
        </aside>

        <main class="client-app admin-app">
            <header class="topbar">
                <div>
                    <div class="brand">OLIMP</div>
                    <h1 id="screen-title">Головна</h1>
                </div>
                <div class="top-actions">
                    <button class="icon-btn notification-btn" aria-label="Повідомлення">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 22a2.8 2.8 0 0 0 2.7-2h-5.4A2.8 2.8 0 0 0 12 22Z"></path>
                            <path d="M18.2 16.5c-.9-1-1.4-2.2-1.4-3.6V10a4.8 4.8 0 0 0-3.5-4.6V4a1.3 1.3 0 1 0-2.6 0v1.4A4.8 4.8 0 0 0 7.2 10v2.9c0 1.4-.5 2.7-1.4 3.6l-.6.7c-.6.7-.1 1.8.8 1.8h12c.9 0 1.4-1.1.8-1.8l-.6-.7Z"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </button>
                    <button class="avatar" data-screen-link="profile" aria-label="Мій профіль" data-account-field="initials"></button>
                </div>
            </header>

            <section class="screen active" data-screen-panel="dashboard">

                <!-- Заголовок: привітання + чіпи дій -->
                <div class="dash-header-row">
                    <div class="dash-greeting">
                        <div>
                            <p class="dash-greeting__eyebrow" id="greeting-time">Доброго дня</p>
                            <h2 class="dash-greeting__name" id="greeting-name">—</h2>
                        </div>
                        <div class="dash-greeting__date" id="greeting-date"></div>
                    </div>
                    <div class="dash-quick-actions">
                        <button class="dash-qa-btn" data-screen="clients">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                            Додати клієнта
                        </button>
                        <button class="dash-qa-btn" data-screen="schedule">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
                            Нове заняття
                        </button>
                        <button class="dash-qa-btn" data-screen="messages">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            Повідомлення
                        </button>
                        <button class="dash-qa-btn" data-screen="plans">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                            Абонементи
                        </button>
                    </div>
                </div>

                <!-- 3 Hero-картки (Fintrixity-стиль) -->
                <div class="dash-hero-cards">

                    <!-- Primary: Клієнти з помаранчевим градієнтом -->
                    <article class="dash-hero-card dash-hero-card--primary" data-screen="clients" role="button" tabindex="0">
                        <div class="dhc-top">
                            <div class="dhc-icon-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            </div>
                            <span class="dhc-label">Клієнти</span>
                        </div>
                        <div class="dhc-value" id="metric-clients">—</div>
                        <p class="dhc-sub">активних клієнтів <span class="metric-trend" id="trend-clients"></span></p>
                        <div class="dhc-footer">
                            <span>Переглянути список</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </div>
                    </article>

                    <!-- Тренери -->
                    <article class="dash-hero-card" data-screen="trainers" role="button" tabindex="0">
                        <div class="dhc-top">
                            <div class="dhc-icon-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M6.5 10a5.5 5.5 0 0 0 11 0"/><path d="M12 16v6"/><path d="M8 22h8"/></svg>
                            </div>
                            <span class="dhc-label">Тренери</span>
                        </div>
                        <div class="dhc-value" id="metric-trainers">—</div>
                        <p class="dhc-sub">у команді <span class="metric-trend" id="trend-trainers"></span></p>
                        <div class="dhc-footer">
                            <span>Детальніше</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </div>
                    </article>

                    <!-- Послуги -->
                    <article class="dash-hero-card" data-screen="services" role="button" tabindex="0">
                        <div class="dhc-top">
                            <div class="dhc-icon-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            </div>
                            <span class="dhc-label">Послуги</span>
                        </div>
                        <div class="dhc-value" id="metric-services">—</div>
                        <p class="dhc-sub">активних послуг <span class="metric-trend" id="trend-services"></span></p>
                        <div class="dhc-footer">
                            <span>Управляти</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </div>
                    </article>
                </div>

                <!-- Середня секція -->
                <div class="dash-mid-row">

                    <!-- Ліво: сьогоднішній розклад -->
                    <article class="panel dash-schedule-card">
                        <div class="dwp-header">
                            <div class="section-label">Сьогоднішній розклад</div>
                            <button class="dash-qa-btn" data-screen="schedule">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:12px;height:12px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Заняття
                            </button>
                        </div>
                        <div class="dash-today-badge">
                            <span class="dash-today-count" id="metric-today">—</span>
                            <span class="dash-today-label">занять сьогодні <span class="metric-trend" id="trend-today"></span></span>
                        </div>
                        <div class="timeline" id="dashboard-today-list"></div>
                    </article>

                    <!-- Право: потребує уваги -->
                    <article class="panel">
                        <div class="section-label">Потребує уваги</div>
                        <div class="attention-list" id="dashboard-attention"></div>
                    </article>
                </div>

            </section>
        </main>

        <nav class="bottom-nav admin-bottom-nav" aria-label="Нижня навігація">
            <button class="bottom-item active" data-screen="dashboard">Головна</button>
                <button class="bottom-item" data-screen="clients">Клієнти</button>
                <button class="bottom-item" data-screen="trainers">Тренери</button>
                <button class="bottom-item" data-screen="schedule">Розклад</button>
                <button class="bottom-item" data-screen="profile">Профіль</button>
        </nav>
    </div>

    <div class="sheet-backdrop" id="sheet">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h2 id="sheet-title">Деталі</h2>
            <div id="sheet-content" class="sheet-content"></div>
            <button class="primary-btn sheet-close">Закрити</button>
        </div>
    </div>

    <div class="modal-backdrop" id="admin-modal">
        <div class="modal admin-modal">
            <h2 id="modal-title">Форма</h2>
            <label>Назва / ім’я<input type="text"></label>
            <label>Телефон або email<input type="text"></label>
            <label>Статус<input type="text" value="Активний"></label>
            <div class="modal-actions">
                <button class="ghost-btn modal-close">Скасувати</button>
                <button class="primary-btn modal-close">Зберегти</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/admin.js"></script>
</body>
</html>
