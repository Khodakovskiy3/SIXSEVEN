<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРМ Тренера</title>
    <link rel="stylesheet" href="../styles/trainer.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1d6f42">
</head>
<body>
    <header>
        <h1>АРМ Тренера Спортивного Клубу</h1>
        <button id="logout-btn" class="delete-btn">Вийти</button>
    </header>
    <nav>
        <ul>
            <li><a href="#schedule">Розклад Тренувань</a></li>
            <li><a href="#groups">Групи Клієнтів</a></li>
            <li><a href="#attendance">Облік Відвідуваності</a></li>
        </ul>
    </nav>
    <main>
        <section id="schedule">
            <h2>Розклад Тренувань</h2>
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Час</th>
                        <th>Тип Тренування</th>
                    </tr>
                </thead>
                <tbody id="trainer-schedule"></tbody>
            </table>
        </section>

        <section id="groups">
            <h2>Групи Клієнтів</h2>
            <p>Виберіть тренування:</p>
            <select id="training-select"></select>
            <button id="view-group">Переглянути</button>
            <div id="group-info" style="display: none;">
                <h3>Клієнти на тренуванні</h3>
                <table id="clients-table">
                    <thead>
                        <tr>
                            <th>Ім'я</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section id="attendance">
            <h2>Облік Відвідуваності</h2>
            <p>Виберіть клієнта зі списку групи та відмітьте візит.</p>
            <select id="attendance-client"></select>
            <button id="mark-visit">Зафіксувати Візит</button>
            <p id="visit-message"></p>
        </section>
    </main>

    <script type="module" src="../js/trainer.js"></script>
    <script type="module" src="../js/pwa.js"></script>
</body>
</html>
