<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIMP — Чат з клієнтами</title>
    <meta name="theme-color" content="#050507">
    <style>
        :root {
            --bg: #050507;
            --surface: rgba(19, 19, 22, 0.92);
            --surface-2: rgba(32, 32, 36, 0.92);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f6f6f7;
            --muted: #b3b3bd;
            --accent: #ff6424;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, 'Segoe UI', sans-serif;
        }

        /* ─── Екран пароля ─────────────────────────────── */
        .gate {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .gate-card {
            width: 100%;
            max-width: 340px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
        }

        .gate-card h1 { font-size: 20px; margin: 0 0 6px; }
        .gate-card p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

        .gate-card input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px;
        }

        .gate-card input:focus { outline: none; border-color: var(--accent); }

        .gate-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .gate-error {
            color: #ff8a8a;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 8px;
        }

        /* ─── Інтерфейс чату ───────────────────────────── */
        .app { display: none; height: 100vh; }
        .app.active { display: flex; }

        .sidebar {
            width: 320px;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }

        .sidebar-head {
            padding: 16px;
            font-weight: 700;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conv-list { flex: 1; overflow-y: auto; }

        .conv-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .conv-item:hover { background: var(--surface-2); }
        .conv-item.active { background: var(--surface-2); border-left: 3px solid var(--accent); }

        .conv-item .conv-title { font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .conv-item .conv-last { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .conv-badge {
            background: #e23b3b;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 7px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .main-empty {
            margin: auto;
            color: var(--muted);
            font-size: 14px;
        }

        .thread { flex: 1; overflow-y: auto; padding: 18px; display: none; flex-direction: column; gap: 8px; }
        .thread.active { display: flex; }

        .msg {
            max-width: 70%;
            padding: 9px 13px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .msg.admin { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
        .msg.guest { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

        .composer { display: none; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
        .composer.active { display: flex; }

        .composer textarea {
            flex: 1;
            resize: none;
            height: 44px;
            max-height: 120px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
        }

        .composer textarea:focus { outline: none; border-color: var(--accent); }

        .composer button {
            border: none;
            background: var(--accent);
            color: #fff;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .sidebar { width: 100%; }
            .app.active { flex-direction: column; }
            .main { display: none; }
        }
    </style>
</head>
<body>
    <!-- Екран пароля -->
    <div class="gate" data-gate>
        <div class="gate-card">
            <h1>Чат з клієнтами</h1>
            <p>Введіть пароль для доступу</p>
            <form data-gate-form>
                <input type="password" data-password placeholder="Пароль" autocomplete="off" autofocus>
                <div class="gate-error" data-gate-error></div>
                <button type="submit">Увійти</button>
            </form>
        </div>
    </div>

    <!-- Інтерфейс чату -->
    <div class="app" data-app>
        <aside class="sidebar">
            <div class="sidebar-head">
                <span>Діалоги</span>
            </div>
            <div class="conv-list" data-conv-list></div>
        </aside>
        <section class="main">
            <div class="main-empty" data-main-empty>Оберіть діалог зліва</div>
            <div class="thread" data-thread></div>
            <form class="composer" data-composer>
                <textarea data-reply placeholder="Ваша відповідь…" maxlength="2000"></textarea>
                <button type="submit">Надіслати</button>
            </form>
        </section>
    </div>

    <script src="../js/chat-admin.js"></script>
</body>
</html>
